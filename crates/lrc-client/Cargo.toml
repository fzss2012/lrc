[package]
name = "lrc-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lrc-client"
path = "src/main.rs"

[dependencies]
lrc-proto.workspace = true
lrc-codec.workspace = true
lrc-render.workspace = true
lrc-transport.workspace = true
lrc-video.workspace = true
lrc-audio.workspace = true
# Win32_Security_Cryptography 只用于 BCryptGenRandom 生成 client_id / nonce_c
windows = { workspace = true, features = ["Win32_Security_Cryptography"] }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
sha2.workspace = true
hmac.workspace = true
