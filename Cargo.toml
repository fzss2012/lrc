[workspace]
resolver = "2"
members = [
    "crates/lrc-proto",
    "crates/lrc-codec",
    "crates/lrc-capture",
    "crates/lrc-render",
    "crates/lrc-transport",
    "crates/lrc-host",
    "crates/lrc-client",
    "crates/lrc-bench",
    "crates/lrc-video",
    "crates/lrc-adapt",
    "crates/lrc-audio",
    "crates/lrc-udp",
    "crates/lrc-relay",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
lrc-proto = { path = "crates/lrc-proto" }
lrc-codec = { path = "crates/lrc-codec" }
lrc-capture = { path = "crates/lrc-capture" }
lrc-render = { path = "crates/lrc-render" }
lrc-transport = { path = "crates/lrc-transport" }
lrc-video = { path = "crates/lrc-video" }
lrc-adapt = { path = "crates/lrc-adapt" }
lrc-audio = { path = "crates/lrc-audio" }
lrc-udp = { path = "crates/lrc-udp" }
lrc-relay = { path = "crates/lrc-relay" }

anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
jpeg-encoder = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
zstd = "0.14"
sha2 = "0.10"
hmac = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1

# 图像编码/解码块很多且很小，dev 下必须开优化，否则采集回环卡在 CPU 上
[profile.dev.package."*"]
opt-level = 2
